{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<body>
    <h1>{% trans "Newsletter archive" %}</h1>
    <ul>
        {% for issue in issues %}
            <li><a href="{{ issue.get_absolute_url }}">{{ issue.title }}</a></li>
        {% empty %}
            <li>{% trans "No issues yet." %}</li>
        {% endfor %}
    </ul>
</body>
</html>
